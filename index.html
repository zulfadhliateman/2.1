la otot menguncup.", "Sistem respiratori menjalankan pertukaran gas.", "Sistem kardiovaskular mengangkut darah dan bahan keperluan tubuh."]}, {"q": "Yang manakah BUKAN fungsi sistem otot?", "o": ["Memberi bentuk tubuh", "Mengekalkan postur", "Menghasilkan haba", "Membentuk kerangka tegar dan melindungi organ"], "a": 3, "e": ["Memberi bentuk tubuh ialah fungsi sistem otot.", "Mengekalkan postur ialah fungsi sistem otot.", "Sistem otot menghasilkan haba untuk mengekalkan suhu normal badan.", "Membentuk kerangka tegar dan melindungi organ ialah fungsi sistem rangka."]}, {"q": "Sistem otot membantu menstabilkan...", "o": ["sendi dan tulang rangka", "kadar hormon dalam darah", "pertukaran gas di paru-paru", "aliran darah ke jantung"], "a": 0, "e": ["Sistem otot membantu menstabilkan sendi-sendi dan tulang rangka.", "Pengawalan hormon ialah fungsi sistem endokrina.", "Pertukaran gas melibatkan sistem respiratori.", "Aliran darah melibatkan sistem kardiovaskular."]}, {"q": "Apakah fungsi sistem saraf yang berkaitan dengan pergerakan?", "o": ["Mengangkut nutrien", "Mengesan, menerima dan bergerak balas terhadap rangsangan", "Menghasilkan sel darah", "Menjalankan pertukaran gas"], "a": 1, "e": ["Pengangkutan nutrien ialah fungsi sistem kardiovaskular.", "Sistem saraf mengesan, menerima dan bergerak balas terhadap rangsangan.", "Pembentukan sel darah berlaku di sum-sum tulang.", "Pertukaran gas respiratori melibatkan sistem respiratori."]}, {"q": "Sistem yang mengawal dan menyelaraskan aktiviti tubuh ialah...", "o": ["Sistem saraf", "Sistem rangka", "Sistem respiratori", "Sistem otot sahaja"], "a": 0, "e": ["Sistem saraf mengawal dan menyelaraskan aktiviti tubuh.", "Sistem rangka menyokong dan melindungi tubuh.", "Sistem respiratori menjalankan pertukaran gas.", "Sistem otot menghasilkan pergerakan tetapi bukan sistem utama penyelarasan aktiviti tubuh."]}, {"q": "Sistem saraf juga mengawal tindak balas...", "o": ["refleks badan", "pembentukan platelet sahaja", "pengangkutan nutrien sahaja", "pertukaran gas sahaja"], "a": 0, "e": ["Sistem saraf berfungsi sebagai sistem kawalan tindak balas refleks badan.", "Pembentukan platelet berlaku di sum-sum tulang.", "Pengangkutan nutrien ialah fungsi sistem kardiovaskular.", "Pertukaran gas ialah fungsi sistem respiratori."]}, {"q": "Sistem endokrina menyelaraskan fungsi tubuh melalui...", "o": ["impuls saraf", "hormon yang dirembeskan ke dalam aliran darah", "penguncupan tulang", "udara dalam paru-paru"], "a": 1, "e": ["Impuls saraf ialah kaedah penyelarasan sistem saraf.", "Sistem endokrina mengawal atur fungsi tubuh melalui hormon dalam aliran darah.", "Tulang tidak menguncup untuk menghasilkan pergerakan.", "Udara dalam paru-paru berkaitan sistem respiratori."]}, {"q": "Hormon daripada sistem endokrina dirembeskan ke dalam...", "o": ["salur pencernaan", "aliran darah", "rongga sendi", "salur udara"], "a": 1, "e": ["Salur pencernaan bukan laluan perembesan hormon yang dinyatakan.", "Hormon dirembeskan ke dalam aliran darah.", "Rongga sendi bukan laluan hormon.", "Salur udara membawa udara dalam sistem respiratori."]}, {"q": "Sistem kardiovaskular melibatkan organ...", "o": ["jantung dan saluran darah", "otak dan saraf tunjang", "paru-paru dan trakea", "tulang dan sendi"], "a": 0, "e": ["Jantung dan saluran darah ialah komponen sistem kardiovaskular.", "Otak dan saraf tunjang berkaitan sistem saraf.", "Paru-paru dan trakea berkaitan sistem respiratori.", "Tulang dan sendi berkaitan sistem rangka."]}, {"q": "Apakah fungsi sistem kardiovaskular?", "o": ["Mengepam darah dari jantung ke seluruh badan dan kembali semula", "Menghasilkan pergerakan melalui penguncupan otot", "Mengesan rangsangan dalaman dan luaran", "Membentuk kerangka tegar"], "a": 0, "e": ["Sistem kardiovaskular mengepam darah ke seluruh badan dan kembali ke jantung.", "Penguncupan otot menghasilkan pergerakan.", "Mengesan rangsangan ialah fungsi sistem saraf.", "Kerangka tegar dibentuk oleh sistem rangka."]}, {"q": "Bahan yang diang
